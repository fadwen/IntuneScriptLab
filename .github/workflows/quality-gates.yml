# Quality gates for IntuneScriptLab.
#
# Five jobs, because the module makes claims that can only fail on different hosts:
#
#   tests     Windows, PowerShell 7. PSScriptAnalyzer at Error and Warning over the module, the
#             kit and the tests, the 115-character line limit, then the whole Pester suite (the
#             module's unit and integration suites and the validation kit's unit suite) with an
#             80% coverage gate over Public/ and Private/. Nothing here reaches a tenant: every
#             Graph call in the suites goes through the mocked Invoke-IslGraphRequest seam, and
#             the suites that need a lab account or a Graph connection skip themselves. The
#             hosted Windows runner is elevated, so the SYSTEM-context tests run: they register
#             scheduled tasks named IntuneScriptLab-* as NT AUTHORITY\SYSTEM on the runner, run
#             a script through each and remove them.
#
#   Every Pester run goes through Tests/Invoke-Tests.ps1, the script a developer runs as well. It
#   shuffles the order, so a test that only passes because of what ran before it fails here
#   rather than on somebody's machine, and it fails when Pester's result is not Passed, which
#   covers a failed BeforeAll or AfterAll and a file that failed discovery, or when no tests ran.
#   The seed is in the failure message and in the job summary; -ShuffleSeed repeats that order.
#
#   desktop   Windows PowerShell 5.1. The scripts the module analyzes run under 5.1 on the
#             device, and so does the module: the manifest declares CompatiblePSEditions Desktop
#             and the root module carries #Requires -Version 5.1. A ternary, a null-coalescing
#             operator or a ForEach-Object -Parallel parses cleanly under 7 and breaks every
#             command under 5.1, and nothing but a 5.1 host notices. The unit and integration
#             suites run here too: the harness launches 5.1 hosts, and a 5.1 trap in it (a stderr
#             line turned into a terminating error, a Group-Object order) shows only here.
#
#   Every test job writes its results as NUnit XML and the tests job its coverage as JaCoCo XML,
#   uploaded as artifacts whether the job passes or fails, so a failure can be read without
#   scrolling the log and the coverage can be compared between runs.
#
#   arm64     Windows on ARM. The runtime harness picks a PowerShell host per architecture, and
#             on an ARM64 device the answers differ from x64: the System32 host is native ARM64,
#             the SysWOW64 host is emulated x86, and there is no x64 host at all. The x64 runner
#             cannot exercise those branches, so the unit suites run again on GitHub's ARM64 image.
#
#   help      Ubuntu. The command help gate: the PlatyPS Markdown under docs/ is valid and
#             complete, the committed MAML in en-US/ was built from it, the generated rule
#             reference matches the rules, and Get-Help serves every command's full help on a
#             case-sensitive filesystem - the only place the -Help.xml capital H can fail.
#
#   rehearsal Windows. The release as far as the upload: Build/Publish-Module.ps1 -WhatIf builds
#             the help, measures the manifest against the Gallery's limits, stages the allowlist
#             and imports the staged copy in a new process. A release that would fail at the tag
#             fails at the pull request instead.
#
# There is no Linux test job on purpose: the harness launches Windows PowerShell hosts, reads
# the registry and registers scheduled tasks, and the rules are about what happens on a Windows
# device. The module imports on Linux, which the help job proves.

name: 'Quality Gates'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

  # Nightly, so that a change outside the repository shows up within a day: a new runner image,
  # a Windows update that adds an in-box module, a Gallery that stops serving a pinned tool.
  schedule:
    - cron: '30 4 * * *'

  # Callable so release.yml can run these exact gates before publishing. A tag can be pushed
  # at any commit, including one that never passed a pull request, so the release re-runs the
  # gates rather than trusting that they ran at some point.
  workflow_call:

permissions:
  contents: read


jobs:
  tests:
    name: 'Tests and analysis'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Runners ship Pester 5.x. Both tools are installed at one fixed version: a newer
          # release can change what an assertion or a rule means, and with it what a passing
          # build means. 6.2.0 is the version the #Requires line of every suite names.
          Install-PSResource -Name Pester -Version 6.2.0 -Scope CurrentUser -TrustRepository
          Install-PSResource -Name PSScriptAnalyzer -Version 1.25.0 -Scope CurrentUser -TrustRepository
          $PSVersionTable | ConvertTo-Json -Depth 3

      # The module, the kit, the build scripts and the tests are what is gated, with the default
      # rules and the layout rules of PSScriptAnalyzerSettings.psd1, the 115-character line
      # (STY-03) among them. The default rules at Error and Warning include the five of
      # PSScriptAnalyzer's ScriptSecurity preset (plain-text passwords, user name and password
      # parameters, ConvertTo-SecureString -AsPlainText, hard-coded computer names and
      # PSCredential parameters), so this step is also the static analysis of a security gate.
      # There is no credential scan and no dependency scan in this workflow: the module has no
      # dependency, and the credential scan is #127.
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folders = 'Public', 'Private', 'PSScriptAnalyzer', 'Examples', 'Build', 'Tests', 'Validation'
          $files = @(Get-ChildItem -Path $folders -Recurse -Include *.ps1, *.psm1, *.psd1 -File) +
              @(Get-Item ./IntuneScriptLab.psd1, ./IntuneScriptLab.psm1)
          # The validation kit's three instruments keep the layout they ran with in the rounds
          # that cite them (Validation/README.md), so they get the default rules only
          $instruments = @('Probe.ps1', 'Win32Install.ps1', 'Fixtures.ps1' |
              ForEach-Object { (Resolve-Path -LiteralPath "Validation/$_").Path })
          $issues = @(foreach ($file in $files) {
              $analyzerSplat = @{ Path = $file.FullName; Severity = 'Error', 'Warning' }
              if ($file.FullName -notin $instruments) {
                  $analyzerSplat['Settings'] = './PSScriptAnalyzerSettings.psd1'
              }
              Invoke-ScriptAnalyzer @analyzerSplat
          })
          if ($issues) {
              $issues | Format-Table RuleName, Severity, ScriptName, Line -AutoSize | Out-String | Write-Host
              throw "PSScriptAnalyzer reported $($issues.Count) issue(s)."
          }
          Write-Host "PSScriptAnalyzer clean with PSScriptAnalyzerSettings.psd1 in $($files.Count) files."

      # Every suite, shuffled, with the 80% coverage gate. The reports are written before the
      # checks run, so a failed run still leaves both files to upload.
      - name: Pester with coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Tests/Invoke-Tests.ps1 -CodeCoverage -OutputPath ./reports -Output Detailed -SummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-and-analysis
          path: reports/
          if-no-files-found: warn

  desktop:
    name: 'Windows PowerShell 5.1'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 'powershell' here is Windows PowerShell 5.1, not pwsh. Import, count the exports
      # against the manifest, and confirm every command serves its compiled help: each export
      # carries .EXTERNALHELP, so there is no comment block to fall back on and a description
      # proves 5.1 read en-US/IntuneScriptLab-Help.xml. A 7-only construct anywhere in the
      # module fails the import itself, which is the failure this job exists to surface.
      - name: Import and verify exports
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          "PowerShell $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition))" | Write-Host

          Import-Module ./IntuneScriptLab.psd1 -Force
          $declared = @((Import-PowerShellDataFile ./IntuneScriptLab.psd1).FunctionsToExport) | Sort-Object
          $actual = @((Get-Module IntuneScriptLab).ExportedFunctions.Keys) | Sort-Object

          if (($declared -join ',') -ne ($actual -join ',')) {
              throw "Exports differ from the manifest. Declared: $($declared.Count); actual: $($actual.Count)."
          }

          $noHelp = @(foreach ($name in $actual) {
              if (-not (Get-Help $name -ErrorAction SilentlyContinue).Description) { $name }
          })
          if ($noHelp) { throw "Commands serving no help under 5.1: $($noHelp -join ', ')" }
          Write-Host "All $($actual.Count) commands exported with help under Windows PowerShell 5.1."

      # Pester 6 declares PowerShellVersion 5.1 and runs the suite unchanged. Windows PowerShell
      # has no PSResourceGet, so PowerShellGet installs the same fixed version the other jobs use.
      - name: Install Pester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
          Import-Module Pester -RequiredVersion 6.2.0
          "Pester $((Get-Module Pester).Version) on PowerShell $($PSVersionTable.PSVersion)" | Write-Host

      # The integration suite as well: it launches the 5.1 hosts the harness uses on a device.
      # The hosted runner is elevated, so the SYSTEM-context tests run here as they do under
      # pwsh: they register and remove IntuneScriptLab-* scheduled tasks as SYSTEM on the runner.
      # The user-context suite needs a lab account and skips itself.
      - name: Pester under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          ./Tests/Invoke-Tests.ps1 -OutputPath ./reports -SummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-powershell-5-1
          path: reports/
          if-no-files-found: warn

  arm64:
    name: 'Windows on ARM'
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PSResource -Name Pester -Version 6.2.0 -Scope CurrentUser -TrustRepository
          Import-Module Pester -RequiredVersion 6.2.0
          "Pester $((Get-Module Pester).Version) on $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)" |
              Write-Host

      - name: Pester on ARM64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Tests/Invoke-Tests.ps1 -TestType Unit -OutputPath ./reports -SummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-on-arm
          path: reports/
          if-no-files-found: warn

  help:
    name: 'Command help'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned exactly, not by minimum. The staleness check below compares a rebuilt MAML
      # against the committed one byte for byte, so a PlatyPS release that changes the
      # emitted XML at all would fail the build for a reason nobody changed. Bump this
      # deliberately, rebuild, and commit the result in the same change.
      - name: Install PlatyPS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PSResource -Name Microsoft.PowerShell.PlatyPS -Version '1.0.3' -Scope CurrentUser -TrustRepository
          $PSVersionTable | ConvertTo-Json -Depth 3

      # Structure, unfilled templates and relative RELATED LINKS in the committed Markdown.
      - name: Validate help Markdown
        shell: pwsh
        run: ./Build/Build-Help.ps1 -ValidateOnly

      # Rebuild from the committed Markdown and compare against the committed MAML. If they
      # differ, someone edited docs/ without running the build - and .EXTERNALHELP means
      # users would be served the stale content rather than falling back to anything correct.
      - name: Fail on stale committed MAML
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $committed = './en-US/IntuneScriptLab-Help.xml'
          if (-not (Test-Path $committed)) { throw "No committed help at $committed." }
          $before = (Get-FileHash $committed -Algorithm SHA256).Hash

          ./Build/Build-Help.ps1 -SkipUpdate | Out-Null

          $after = (Get-FileHash $committed -Algorithm SHA256).Hash
          if ($before -ne $after) {
              throw 'en-US/IntuneScriptLab-Help.xml is out of date. Run ./Build/Build-Help.ps1 and commit the result.'
          }
          Write-Host 'Committed MAML matches the Markdown.'

      # The rule reference is generated from the rule files; a stale copy misleads the reader
      # about what a rule reports.
      - name: Fail on a stale rule reference
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $generated = ./Build/Build-RuleReference.ps1 -PassThru
          $committed = [System.IO.File]::ReadAllText('./docs/Rules.md')
          if (($generated -replace "`r`n", "`n") -ne ($committed -replace "`r`n", "`n")) {
              throw 'docs/Rules.md is out of date. Run ./Build/Build-RuleReference.ps1 and commit the result.'
          }
          Write-Host 'docs/Rules.md matches the rules.'

      # Get-Help resolves .EXTERNALHELP against the culture folder by exact filename, so a
      # casing mismatch fails here and only here.
      - name: Verify Get-Help on a case-sensitive filesystem
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./IntuneScriptLab.psd1 -Force

          $failed = @()
          foreach ($command in (Get-Module IntuneScriptLab).ExportedFunctions.Keys | Sort-Object) {
              $help = Get-Help $command -Full

              # An autogenerated stub is the symptom of MAML that was not found: PowerShell
              # falls back to reflected syntax with no description and no examples.
              if (-not $help.Description) { $failed += "$command : no description" ; continue }
              if (@($help.Examples.Example).Count -lt 3) { $failed += "$command : fewer than 3 examples" ; continue }
              # A command with no parameters of its own has no parameter help to serve
              $common = [System.Management.Automation.Cmdlet]::CommonParameters
              $own = @((Get-Command $command).Parameters.Keys | Where-Object { $_ -notin $common })
              if ($own -and -not $help.parameters.parameter) { $failed += "$command : no parameter help" ; continue }

              Write-Host ("{0,-30} {1} examples, {2} parameters" -f
                  $command, @($help.Examples.Example).Count, @($help.parameters.parameter).Count)
          }

          if (-not (Get-Help about_IntuneScriptLab -ErrorAction SilentlyContinue)) {
              $failed += 'about_IntuneScriptLab : topic not found'
          }

          if ($failed) {
              $failed | ForEach-Object { Write-Host "FAILED: $_" }
              throw 'MAML help was not served on a case-sensitive filesystem.'
          }
          Write-Host 'All commands served full help from MAML.'

      # The static analysis is the one part of the module a Linux host can use: it needs the
      # file and nothing else. This step keeps that true. The script type is inferred from
      # folder names, so the fixtures use the layouts the suite template describes, with the
      # separators this host writes; the harness and the log readers stay Windows-only.
      - name: Analyze scripts on Linux
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./IntuneScriptLab.psd1 -Force

          $root = Join-Path ([System.IO.Path]::GetTempPath()) "isl-linux-$([guid]::NewGuid().ToString('N'))"
          $remediation = Join-Path $root 'Remediations/Widget'
          $win32 = Join-Path $root 'Win32/Widget'
          New-Item -ItemType Directory -Path $remediation, $win32 -Force | Out-Null
          # return before exit 1: the remediation never runs (IslExitCodeIssue, Error)
          Set-Content -Path (Join-Path $remediation 'Detect.ps1') -Value "if (Test-Path /tmp/x) { return 'ok' }`nexit 1"
          # exit 0 with nothing on stdout: the app is never detected (IslOutputIssue, Error)
          Set-Content -Path (Join-Path $win32 'Detect.ps1') -Value "if (Test-Path /tmp/x) { exit 0 }`nexit 1"

          $findings = @(Test-IntuneScript -Path $root)
          $findings | Format-Table Severity, RuleName, Line, @{ n = 'Script'; e = { Split-Path (Split-Path $_.ScriptPath) -Leaf } } -AutoSize | Out-String | Write-Host

          $failed = @()
          $exit = @($findings | Where-Object { $_.RuleName -eq 'IslExitCodeIssue' -and $_.Severity -eq 'Error' -and $_.ScriptPath -like '*Remediations*' })
          if (-not $exit) { $failed += 'the return-before-exit detection was not reported' }
          $output = @($findings | Where-Object { $_.RuleName -eq 'IslOutputIssue' -and $_.Severity -eq 'Error' -and $_.ScriptPath -like '*Win32*' })
          if (-not $output) { $failed += 'the silent Win32 detection was not reported' }
          $context = @($findings | Where-Object { $_.RuleName -eq 'IslAssumedContext' -and $_.Message -like '*Win32Detection*' })
          if (-not $context) { $failed += 'the Win32 folder did not set the script type' }
          Remove-Item -Path $root -Recurse -Force

          if ($failed) {
              $failed | ForEach-Object { Write-Host "FAILED: $_" }
              throw 'Test-IntuneScript did not analyze the fixtures on Linux.'
          }
          Write-Host 'Test-IntuneScript analyzed both fixtures on Linux with the expected findings.'

  rehearsal:
    name: 'Release rehearsal'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The same pin as the help job: the rehearsal rebuilds the MAML, and a different PlatyPS
      # version would emit different XML than the committed help.
      - name: Install PlatyPS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PSResource -Name Microsoft.PowerShell.PlatyPS -Version '1.0.3' -Scope CurrentUser -TrustRepository

      # Everything the release does except the upload, which -WhatIf holds back. No API key is
      # read under -WhatIf, so the job needs no secret.
      - name: Stage and verify the package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Build/Publish-Module.ps1 -WhatIf
